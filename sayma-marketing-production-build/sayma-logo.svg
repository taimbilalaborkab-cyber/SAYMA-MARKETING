<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Vibrant 3D Royal Blue Gradient matching Sayma Marketing brand -->
    <linearGradient id="saymaBlueGrad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="40%" stop-color="#0072F5" />
      <stop offset="85%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Top Highlight for 3D ribbon look -->
    <linearGradient id="saymaBlueHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0072F5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#003D99" stop-opacity="0.8" />
    </linearGradient>

    <!-- Charcoal Gray gradient for lower S loop and arrow shaft -->
    <linearGradient id="saymaCharcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555962" />
      <stop offset="100%" stop-color="#32343A" />
    </linearGradient>
  </defs>

  <g id="sayma-icon-mark" transform="translate(40, 0)">
    <!-- 1. Bottom Dark Charcoal Loop of the "S" -->
    <path
      d="M 148 142 
         C 188 142, 218 168, 218 202 
         C 218 238, 184 266, 138 266 
         C 96 266, 70 242, 68 218 
         C 66 204, 78 194, 92 194 
         C 106 194, 114 204, 122 212 
         C 130 220, 142 226, 158 226 
         C 178 226, 190 216, 190 202 
         C 190 186, 174 176, 145 176 
         C 125 176, 108 166, 104 154 
         C 114 144, 130 142, 148 142 Z"
      fill="url(#saymaCharcoalGrad)"
    />

    <!-- 2. Arrow Shaft pointing upward-right (45°) -->
    <path
      d="M 152 165 
         L 225 76 
         L 255 102 
         L 182 191 Z"
      fill="#33363B"
    />

    <!-- 3. Dynamic Outer & Upper Blue Ribbon of the "S" -->
    <path
      d="M 64 212 
         C 60 156, 100 75, 168 46 
         C 212 28, 252 48, 266 84 
         C 275 106, 270 134, 256 160 
         C 238 190, 206 220, 170 244 
         C 136 266, 102 278, 74 268 
         C 64 264, 60 252, 66 242 
         C 72 232, 84 230, 96 235 
         C 122 246, 156 236, 186 212 
         C 218 186, 242 154, 246 126 
         C 250 100, 234 80, 200 74 
         C 160 67, 118 97, 92 140 
         C 76 168, 70 194, 72 214 
         C 68 217, 65 215, 64 212 Z"
      fill="url(#saymaBlueGrad)"
    />

    <!-- 4. Inner Blue Dynamic Curve / Loop (smooth 3D depth) -->
    <path
      d="M 68 208 
         C 76 138, 132 58, 200 44 
         C 244 34, 274 62, 274 102 
         C 274 136, 254 170, 222 200 
         C 185 234, 146 255, 106 250 
         C 85 246, 73 233, 70 216 
         C 78 218, 88 222, 102 225 
         C 136 231, 172 213, 202 184 
         C 230 156, 246 124, 244 98 
         C 242 74, 221 62, 191 65 
         C 148 70, 103 108, 80 158 
         C 70 180, 68 200, 68 208 Z"
      fill="url(#saymaBlueHighlight)"
    />

    <!-- 5. Solid Arrow Head -->
    <path
      d="M 215 72 
         L 272 24 
         L 272 118 
         L 250 96 
         L 234 112 
         L 215 94 
         L 230 78 Z"
      fill="#33363B"
    />
  </g>

  <!-- Typography matching exact Sayma Marketing brand wordmark -->
  <text
    x="200"
    y="325"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Tajawal', sans-serif"
    font-weight="900"
    font-size="60"
    fill="#2A2C31"
    letter-spacing="-1px"
  >sayma</text>

  <text
    x="200"
    y="365"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Montserrat', 'Inter', 'Tajawal', sans-serif"
    font-weight="800"
    font-size="22"
    fill="#555962"
    letter-spacing="7px"
  >MARKETING</text>
</svg>
